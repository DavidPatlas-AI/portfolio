<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פיצול HTML לקבצים נפרדים</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:rgba(15,15,30,.9);backdrop-filter:blur(10px);padding:8px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(245,200,66,.25);font-family:Rubik,sans-serif">
<a href="https://storied-alfajores-6f10d2.netlify.app/portfolio.html" style="color:#f5c842;text-decoration:none;font-weight:700;font-size:.85rem">← תיק עבודות</a>
<span style="background:linear-gradient(135deg,#f5c842,#e0a820);color:#111;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:800">גרסה מאוחדת v3 · מפצל קוד</span></div>
    <div class="container">
        <div class="header">
            <h1>🔧 פיצול HTML לקבצים נפרדים</h1>
            <p>הדבק את הקוד שלך והפוך אותו לקבצים נפרדים של HTML, CSS ו-JavaScript</p>
        </div>

        <div class="input-section">

            <textarea id="htmlInput" class="input-box" placeholder="הדבק כאן את קוד ה-HTML המלא עם CSS ו-JavaScript מוטבעים..."></textarea>
            
            <div class="button-container">
                <button id="splitBtn" class="split-btn">🚀 פצל לקבצים נפרדים</button>
            </div>

            <div id="message" class="message"></div>
        </div>

        <div id="results" class="results">
            <div class="results-title">📁 הקבצים שלך מוכנים!</div>
            <div id="fileGrid" class="file-grid"></div>
            <div class="download-all">
                <button id="downloadAllBtn" class="download-all-btn">📦 הורד את כל הקבצים</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
