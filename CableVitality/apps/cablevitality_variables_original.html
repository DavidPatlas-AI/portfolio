<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CableVitality – Variable Database</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080e;--panel:#0a1320;--panel2:#0e1c30;--border:#172f50;
  --accent:#00c8ff;--green:#00ffa3;--warn:#ffc300;--red:#ff3d3d;--orange:#ff8c00;
  --text:#bdd8f0;--muted:#3a6080;--muted2:#5580a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Heebo',sans-serif;color:var(--text);display:flex;flex-direction:column;}

/* TOP */
#top{
  height:50px;flex-shrink:0;background:var(--panel2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
}
.logo{display:flex;align-items:center;gap:10px;}
.ring{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--accent),var(--green),var(--accent));animation:spin 6s linear infinite;position:relative;}
.ring::after{content:'';position:absolute;inset:4px;background:var(--bg);border-radius:50%;}
@keyframes spin{to{transform:rotate(360deg);}}
.logo h1{font-size:1.1rem;font-weight:900;}
.logo h1 span{color:var(--accent);}
.logo-sub{font-size:.58rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.badge{background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.25);color:var(--accent);font-size:.62rem;font-family:'IBM Plex Mono',monospace;padding:2px 10px;border-radius:20px;}

/* TOOLBAR */
#toolbar{
  height:46px;flex-shrink:0;background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
#search{
  flex:1;max-width:280px;height:30px;
  background:var(--panel2);border:1px solid var(--border);
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  padding:0 10px;border-radius:5px;outline:none;
  transition:.2s;
}
#search:focus{border-color:var(--accent);}
#search::placeholder{color:var(--muted);}
.tb-btn{
  height:28px;padding:0 12px;border-radius:5px;border:none;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;font-weight:600;
  transition:.15s;
}
.tb-btn.primary{background:rgba(0,200,255,.12);color:var(--accent);border:1px solid rgba(0,200,255,.25);}
.tb-btn.primary:hover{background:rgba(0,200,255,.22);}
.tb-btn.warn{background:rgba(255,195,0,.1);color:var(--warn);border:1px solid rgba(255,195,0,.2);}
.tb-btn.warn:hover{background:rgba(255,195,0,.2);}
.tb-btn.green{background:rgba(0,255,163,.08);color:var(--green);border:1px solid rgba(0,255,163,.2);}
.tb-btn.green:hover{background:rgba(0,255,163,.16);}
.cat-select{
  height:28px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.65rem;
  padding:0 8px;border-radius:5px;outline:none;cursor:pointer;
}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
.qa-summary{display:flex;gap:8px;margin-right:auto;}
.qa-pill{font-size:.62rem;font-family:'IBM Plex Mono',monospace;padding:2px 10px;border-radius:20px;border:1px solid;}
.qa-pill.ok{color:var(--green);border-color:rgba(0,255,163,.3);background:rgba(0,255,163,.06);}
.qa-pill.fail{color:var(--red);border-color:rgba(255,61,61,.3);background:rgba(255,61,61,.08);animation:flash .8s infinite;}
@keyframes flash{50%{opacity:.5;}}

/* MAIN */
#main{flex:1;display:flex;min-height:0;}

/* LEFT SIDEBAR */
#sidebar{
  width:160px;flex-shrink:0;background:var(--panel);
  border-left:1px solid var(--border);overflow-y:auto;padding:10px 8px;
}
#sidebar::-webkit-scrollbar{width:3px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);}
.cat-item{
  padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.68rem;
  display:flex;align-items:center;justify-content:space-between;
  transition:.15s;margin-bottom:2px;
}
.cat-item:hover{background:var(--panel2);}
.cat-item.active{background:rgba(0,200,255,.1);color:var(--accent);}
.cat-item .cnt{
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  background:var(--border);padding:1px 5px;border-radius:10px;color:var(--muted2);
}
.cat-item.active .cnt{background:rgba(0,200,255,.15);color:var(--accent);}
.cat-label{
  font-size:.58rem;font-family:'IBM Plex Mono',monospace;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  padding:10px 10px 4px;
}

/* TABLE */
#table-wrap{flex:1;overflow:auto;min-width:0;}
#table-wrap::-webkit-scrollbar{width:6px;height:6px;}
#table-wrap::-webkit-scrollbar-track{background:var(--panel);}
#table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

table{width:100%;border-collapse:collapse;font-size:.68rem;}
thead{position:sticky;top:0;z-index:5;}
th{
  background:var(--panel2);border-bottom:2px solid var(--border);
  padding:9px 10px;text-align:right;font-size:.6rem;
  font-family:'IBM Plex Mono',monospace;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  cursor:pointer;user-select:none;
}
th:hover{color:var(--accent);}
th.sort-asc::after{content:' ↑';}
th.sort-desc::after{content:' ↓';}
td{
  padding:7px 10px;border-bottom:1px solid rgba(23,47,80,.5);
  vertical-align:middle;white-space:nowrap;
}
tr:hover td{background:rgba(0,200,255,.03);}
tr.qa-error td{background:rgba(255,61,61,.04);}
tr.qa-error td:first-child{border-right:2px solid var(--red);}
tr.selected td{background:rgba(0,200,255,.07);}

.idx{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.6rem;}
.sym{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-weight:600;}
.name-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;}
.unit-cell{font-family:'IBM Plex Mono',monospace;color:var(--muted2);font-size:.62rem;}
.val-cell{font-family:'IBM Plex Mono',monospace;color:var(--green);font-weight:600;}
.range-cell{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted2);}
.cat-badge{
  display:inline-block;padding:2px 7px;border-radius:3px;
  font-size:.58rem;font-family:'IBM Plex Mono',monospace;font-weight:600;
}
.src-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.6rem;}
.qa-cell{text-align:center;}
.qa-ok{color:var(--green);}
.qa-fail{color:var(--red);}
.edit-btn{
  background:none;border:1px solid var(--border);color:var(--muted2);
  font-size:.58rem;padding:2px 6px;border-radius:3px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;transition:.15s;
}
.edit-btn:hover{border-color:var(--accent);color:var(--accent);}

/* DETAIL PANEL */
#detail{
  width:260px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);padding:14px;
  overflow-y:auto;display:flex;flex-direction:column;gap:10px;
}
#detail::-webkit-scrollbar{width:3px;}
#detail::-webkit-scrollbar-thumb{background:var(--border);}
.d-title{font-size:.95rem;font-weight:900;color:var(--text);line-height:1.3;}
.d-sym{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--accent);font-weight:600;}
.d-row{display:flex;flex-direction:column;gap:2px;}
.d-label{font-size:.58rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;}
.d-val{font-size:.78rem;font-family:'IBM Plex Mono',monospace;color:var(--text);}
.d-divider{height:1px;background:var(--border);}
.d-range-bar{margin-top:4px;}
.d-range-track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--border);}
.d-range-fill{position:absolute;height:100%;background:var(--accent);border-radius:3px;}
.d-range-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--muted);margin-top:2px;}
.edit-input{
  width:100%;background:var(--panel2);border:1px solid var(--border);
  color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:.78rem;
  padding:5px 8px;border-radius:4px;outline:none;
}
.edit-input:focus{border-color:var(--accent);}
.save-btn{
  width:100%;padding:7px;background:rgba(0,200,255,.12);
  border:1px solid rgba(0,200,255,.3);color:var(--accent);
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:600;
  border-radius:5px;cursor:pointer;transition:.15s;
}
.save-btn:hover{background:rgba(0,200,255,.22);}
.d-hint{font-size:.62rem;color:var(--muted);line-height:1.6;}
.qa-status{padding:8px 10px;border-radius:6px;font-size:.7rem;font-weight:700;}
.qa-status.ok{background:rgba(0,255,163,.08);border:1px solid rgba(0,255,163,.2);color:var(--green);}
.qa-status.fail{background:rgba(255,61,61,.1);border:1px solid rgba(255,61,61,.25);color:var(--red);}

/* cat colors */
.cat-env{background:rgba(0,200,100,.12);color:#00c864;}
.cat-drone{background:rgba(0,150,255,.12);color:#0096ff;}
.cat-cable{background:rgba(255,150,0,.12);color:#ff9600;}
.cat-fiber{background:rgba(200,100,255,.12);color:#c864ff;}
.cat-mat{background:rgba(255,200,0,.12);color:#ffc800;}
.cat-aero{background:rgba(0,220,255,.12);color:#00dcff;}
.cat-ofdr{background:rgba(255,80,150,.12);color:#ff5096;}
.cat-risk{background:rgba(255,60,60,.12);color:#ff3c3c;}
.cat-ops{background:rgba(100,255,100,.12);color:#64ff64;}
.cat-qa{background:rgba(150,150,255,.12);color:#9696ff;}
.cat-struct{background:rgba(255,180,100,.12);color:#ffb464;}
.cat-tms{background:rgba(100,200,200,.12);color:#64c8c8;}
</style>
<style id="cv-home-nav-style">.cv-home-nav{position:fixed;z-index:99999;left:14px;top:14px;display:flex;gap:8px;align-items:center;font-family:Arial,"Segoe UI",sans-serif;direction:rtl}.cv-home-nav a{min-height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(5,12,14,.72);backdrop-filter:blur(14px);color:#eef8f4;text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.22)}.cv-home-nav a:hover{border-color:rgba(66,211,146,.6);color:#42d392}@media(max-width:640px){.cv-home-nav{left:8px;top:8px}.cv-home-nav a{font-size:12px;padding:0 10px}}</style><link rel="stylesheet" href="../assets/mobile-shell.css">
<link rel="stylesheet" href="../assets/site-polish.css">

<body><div class="cv-home-nav"><a href="../index.html">בית</a><a href="../index.html#apps">כל הדפים</a></div>

<div id="top">
  <div class="logo">
    <div class="ring"></div>
    <div>
      <h1>Cable<span>Vitality</span> <span style="font-size:.65rem;color:var(--muted)">Variable DB</span></h1>
      <div class="logo-sub">GORE 24AWG · ITU-T G.652.D · IEC 60794 · Facchinetti 2004</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <span class="badge" id="total-badge">127 משתנים</span>
    <span class="badge" style="color:var(--green);border-color:rgba(0,255,163,.25);background:rgba(0,255,163,.06);">v3.0</span>
  </div>
</div>

<div id="toolbar">
  <input type="text" id="search" placeholder="🔍  חיפוש לפי שם, סמל, יחידות...">
  <select class="cat-select" id="cat-filter">
    <option value="all">כל הקטגוריות</option>
  </select>
  <div class="sep"></div>
  <button class="tb-btn warn" onclick="runQA()">⚡ הרץ QA</button>
  <button class="tb-btn green" onclick="exportCSV()">📥 ייצא CSV</button>
  <button class="tb-btn primary" onclick="resetEdits()">↩ אפס עריכות</button>
  <div class="sep"></div>
  <div class="qa-summary" id="qa-summary"></div>
</div>

<div id="main">
  <div id="detail">
    <div style="font-size:.62rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-align:center;margin-top:40px;">
      בחר משתנה מהטבלה<br>לפרטים ועריכה
    </div>
  </div>

  <div id="table-wrap">
    <table id="var-table">
      <thead>
        <tr>
          <th onclick="sortBy('index')">#</th>
          <th onclick="sortBy('symbol')">סמל</th>
          <th onclick="sortBy('name')">שם</th>
          <th onclick="sortBy('typical')">ערך טיפוסי</th>
          <th onclick="sortBy('unit')">יחידות</th>
          <th>טווח</th>
          <th onclick="sortBy('category')">קטגוריה</th>
          <th>QA</th>
          <th>מקור</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="sidebar">
    <div class="cat-label">קטגוריות</div>
    <div id="cat-list"></div>
  </div>
</div>

// Build objects
let VARS = RAW.map(r => ({
  index:r[0], symbol:r[1], name:r[2], unit:r[3], typical:r[4],
  min_val:r[5], max_val:r[6], category:r[7], source:r[8], description:r[9],
  edited_typical:null, qa_error:null
}));

let sortKey='index', sortDir=1, filterCat='all', filterText='', selectedIdx=null;

// ====== RENDER TABLE ======
function filteredVars(){
  return VARS.filter(v=>{
    if(filterCat!=='all' && v.category!==filterCat) return false;
    if(filterText){
      const q=filterText.toLowerCase();
      return v.symbol.toLowerCase().includes(q)||v.name.toLowerCase().includes(q)||v.unit.toLowerCase().includes(q)||v.source.toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b)=>{
    const av=a[sortKey],bv=b[sortKey];
    if(typeof av==='number') return sortDir*(av-bv);
    return sortDir*(String(av).localeCompare(String(bv)));
  });
}

function renderTable(){
  const fv=filteredVars();
  const tbody=document.getElementById('tbody');
  tbody.innerHTML=fv.map(v=>{
    const val=v.edited_typical??v.typical;
    const inRange=typeof val==='number'?val>=v.min_val&&val<=v.max_val:true;
    const cat=CATS[v.category]||{label:v.category,color:'cat-qa'};
    const isSelected=selectedIdx===v.index;
    return `<tr class="${v.qa_error?'qa-error':''} ${isSelected?'selected':''}" onclick="selectVar(${v.index})">
      <td class="idx">${v.index}</td>
      <td class="sym">${v.symbol}</td>
      <td class="name-cell" title="${v.description}">${v.name}</td>
      <td class="val-cell" style="color:${inRange?'var(--green)':'var(--red)'}">${fmtNum(val)}</td>
      <td class="unit-cell">${v.unit}</td>
      <td class="range-cell">[${fmtNum(v.min_val)}, ${fmtNum(v.max_val)}]</td>
      <td><span class="cat-badge ${cat.color}">${cat.label}</span></td>
      <td class="qa-cell">${inRange?'<span class="qa-ok">✓</span>':'<span class="qa-fail">✗</span>'}</td>
      <td class="src-cell" title="${v.source}">${v.source}</td>
      <td><button class="edit-btn" onclick="event.stopPropagation();selectVar(${v.index})">✏</button></td>
    </tr>`;
  }).join('');
  document.getElementById('total-badge').textContent=`${fv.length} / ${VARS.length} משתנים`;
}

function fmtNum(n){
  if(typeof n!=='number') return String(n);
  if(Math.abs(n)>=1e9||Math.abs(n)<1e-4&&n!==0) return n.toExponential(2);
  if(Math.abs(n)>=1000) return n.toLocaleString('he-IL',{maximumFractionDigits:0});
  return parseFloat(n.toPrecision(4)).toString();
}

// ====== CATEGORY SIDEBAR ======
function renderSidebar(){
  const counts={};
  VARS.forEach(v=>counts[v.category]=(counts[v.category]||0)+1);
  const el=document.getElementById('cat-list');
  const sel=document.getElementById('cat-filter');
  const allItem=`<div class="cat-item ${filterCat==='all'?'active':''}" onclick="setCat('all')">כל הקטגוריות <span class="cnt">${VARS.length}</span></div>`;
  const items=Object.entries(CATS).map(([k,c])=>`<div class="cat-item ${filterCat===k?'active':''}" onclick="setCat('${k}')"><span>${c.label}</span><span class="cnt">${counts[k]||0}</span></div>`).join('');
  el.innerHTML=allItem+items;
  // update select
  if(!sel.options.length||sel.options.length<2){
    sel.innerHTML='<option value="all">כל הקטגוריות</option>'+Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('');
  }
}

function setCat(c){filterCat=c;renderSidebar();renderTable();}

// ====== SORT ======
function sortBy(k){
  if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
  document.querySelectorAll('th').forEach(t=>t.classList.remove('sort-asc','sort-desc'));
  renderTable();
}

// ====== SELECT + DETAIL ======
function selectVar(idx){
  selectedIdx=idx;
  const v=VARS.find(x=>x.index===idx);
  if(!v) return;
  const val=v.edited_typical??v.typical;
  const inRange=typeof val==='number'?val>=v.min_val&&val<=v.max_val:true;
  const pct=typeof val==='number'?Math.max(0,Math.min(100,((val-v.min_val)/(v.max_val-v.min_val)||0)*100)):50;
  const cat=CATS[v.category]||{label:v.category,color:'cat-qa'};
  document.getElementById('detail').innerHTML=`
    <div>
      <div class="d-sym">${v.symbol}</div>
      <div class="d-title" style="margin-top:4px;">${v.name}</div>
    </div>
    <div class="d-divider"></div>
    <div class="d-row"><div class="d-label">תיאור</div><div class="d-hint">${v.description}</div></div>
    <div class="d-divider"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="d-row"><div class="d-label">ערך טיפוסי</div><div class="d-val" style="color:var(--green)">${fmtNum(val)} ${v.unit}</div></div>
      <div class="d-row"><div class="d-label">יחידות</div><div class="d-val">${v.unit}</div></div>
      <div class="d-row"><div class="d-label">מינימום</div><div class="d-val">${fmtNum(v.min_val)}</div></div>
      <div class="d-row"><div class="d-label">מקסימום</div><div class="d-val">${fmtNum(v.max_val)}</div></div>
      <div class="d-row"><div class="d-label">קטגוריה</div><div class="d-val"><span class="cat-badge ${cat.color}">${cat.label}</span></div></div>
      <div class="d-row"><div class="d-label">אינדקס</div><div class="d-val">#${v.index}</div></div>
    </div>
    <div class="d-range-bar">
      <div class="d-label" style="margin-bottom:4px;">מיקום בטווח</div>
      <div class="d-range-track">
        <div class="d-range-fill" style="width:${pct.toFixed(1)}%;background:${inRange?'var(--accent)':'var(--red)'}"></div>
      </div>
      <div class="d-range-labels"><span>${fmtNum(v.min_val)}</span><span style="color:var(--accent)">${fmtNum(val)}</span><span>${fmtNum(v.max_val)}</span></div>
    </div>
    <div class="d-divider"></div>
    <div class="${inRange?'qa-status ok':'qa-status fail'}">${inRange?'✓ QA תקין – בגבולות':'✗ QA כשל – מחוץ לטווח'}</div>
    <div class="d-divider"></div>
    <div class="d-label" style="margin-bottom:5px;">ערוך ערך טיפוסי</div>
    <input class="edit-input" id="edit-val" type="number" value="${val}" step="any">
    <button class="save-btn" style="margin-top:6px;" onclick="saveEdit(${idx})">💾 שמור שינוי</button>
    <div class="d-divider"></div>
    <div class="d-row"><div class="d-label">מקור / תקן</div><div class="d-hint" style="color:var(--muted2)">${v.source}</div></div>
  `;
  renderTable();
}

function saveEdit(idx){
  const v=VARS.find(x=>x.index===idx);
  const val=parseFloat(document.getElementById('edit-val').value);
  if(isNaN(val)) return;
  v.edited_typical=val;
  v.qa_error=val<v.min_val||val>v.max_val;
  selectVar(idx);
  updateQASummary();
}

// ====== QA ======
function runQA(){
  VARS.forEach(v=>{
    const val=v.edited_typical??v.typical;
    v.qa_error=typeof val==='number'&&(val<v.min_val||val>v.max_val);
  });
  updateQASummary();
  renderTable();
}

function updateQASummary(){
  const errors=VARS.filter(v=>v.qa_error).length;
  const ok=VARS.length-errors;
  document.getElementById('qa-summary').innerHTML=`
    <span class="qa-pill ok">✓ ${ok} תקינים</span>
    ${errors?`<span class="qa-pill fail">✗ ${errors} שגיאות</span>`:''}
  `;
}

function resetEdits(){
  VARS.forEach(v=>{v.edited_typical=null;v.qa_error=null;});
  updateQASummary();
  if(selectedIdx) selectVar(selectedIdx);
  else renderTable();
}

// ====== EXPORT CSV ======
function exportCSV(){
  const headers=['#','Symbol','Name','Unit','Typical','Min','Max','Category','Source'];
  const rows=filteredVars().map(v=>[
    v.index,`"${v.symbol}"`,`"${v.name}"`,`"${v.unit}"`,
    v.edited_typical??v.typical,v.min_val,v.max_val,
    `"${v.category}"`,`"${v.source}"`
  ].join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='cablevitality_variables.csv';
  a.click();
}

// ====== SEARCH ======
document.getElementById('search').addEventListener('input',e=>{
  filterText=e.target.value;
  renderTable();
});
document.getElementById('cat-filter').addEventListener('change',e=>{
  filterCat=e.target.value;
  renderSidebar();
  renderTable();
});

// ====== INIT ======
runQA();
renderSidebar();
renderTable();
</script>
<div class="cv-mobile-orbit" aria-hidden="true"></div>
<script src="../assets/site-polish.js"></script>
</body>
</html>
