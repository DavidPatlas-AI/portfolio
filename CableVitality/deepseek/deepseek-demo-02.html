<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ===================== GLOBAL STATE =====================
const S = {
    height: 80, dist: 60, wind: 8, humidity: 60, temp: 28,
    length: 100, mass: 19, diam: 3.2, T_break: 910, R_min: 0.0075,
    E: 2e9, cd: 1.0,
    threats: { cut: false, bend: false, impact: false, chem: false },
    model: 'custom', phosphor_conc: 0.0
};

// ===================== MODELS DB =====================
const CABLE_MODELS = {
    custom:  { mass:19, diam:3.2, T_break:910, R_min:7.5, E:2e9, cd:1.0 },
    gore24:  { mass:19, diam:3.2, T_break:910, R_min:7.5, E:2e9, cd:1.0 },
    ulinx:   { mass:0.75, diam:0.8, T_break:200, R_min:5, E:70e9, cd:0.9 },
    tk3:     { mass:12, diam:2.8, T_break:200, R_min:7.5, E:2e9, cd:1.0 },
    linden:  { mass:18, diam:6.35, T_break:10675, R_min:127, E:5e9, cd:1.1 }
};
const DRONE_MODELS = {
    custom: {},
    shahed238:   { mass:25, diam:4, T_break:1200, R_min:10, E:2.2e9, cd:1.1 },
    molniya:     { mass:18, diam:3, T_break:800, R_min:8, E:1.8e9, cd:1.0 },
    queenhornet: { mass:22, diam:3.5, T_break:950, R_min:7.5, E:2e9, cd:1.0 },
    kolibri:     { mass:14, diam:2.8, T_break:650, R_min:7.5, E:2.1e9, cd:0.95 },
    horror:      { mass:15, diam:3, T_break:700, R_min:7.5, E:2e9, cd:1.0 },
    predator:    { mass:12, diam:2.8, T_break:600, R_min:7.5, E:2e9, cd:0.9 }
};

// ===================== PHYSICS =====================
const G = 9.8067, RHO = 1.204, ST = 0.2;

function catenaryShape(Th, m_kgm, L, Dh, delta_h, wind, n = 150) {
    const w = m_kgm * G;
    const a = Math.max(Th / w, 0.1);
    const xs = [], ys = [], zs = [], tens = [], rads = new Array(n).fill(1e6);
    for (let i = 0; i < n; i++) {
        const f = i / (n - 1), x = f * Dh;
        const sag = (w * Dh * Dh) / (8 * Th);
        const z = f * delta_h - 4 * sag * f * (1 - f);
        xs.push(x); ys.push(0); zs.push(z);
        tens.push(Math.sqrt(Th * Th + (w * z) * (w * z)));
    }
    const fd = 0.5 * RHO * S.cd * (S.diam / 1000) * wind * wind;
    for (let i = 0; i < n; i++) {
        const s = (i / (n - 1)) * L;
        const yDef = (fd / Math.max(Th, 1)) * s * (L - s) * 0.08;
        xs[i] += yDef * Math.cos(0.3);
        ys[i] += yDef * Math.sin(0.3);
    }
    for (let i = 1; i < n - 1; i++) {
        const p0 = [xs[i-1],ys[i-1],zs[i-1]], p1 = [xs[i],ys[i],zs[i]], p2 = [xs[i+1],ys[i+1],zs[i+1]];
        const v1 = [p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], v2 = [p2[0]-p1[0],p2[1]-p1[1],p2[2]-p1[2]];
        const ds = Math.hypot(...v1) + Math.hypot(...v2);
        const cross = [v1[1]*v2[2]-v1[2]*v2[1], v1[2]*v2[0]-v1[0]*v2[2], v1[0]*v2[1]-v1[1]*v2[0]];
        const curv = Math.hypot(...cross) / (ds * ds * 0.125);
        rads[i] = curv > 0 ? 1 / curv : 1e6;
    }
    return { xs, ys, zs, tens, rads };
}

function dewPoint(T, RH) {
    const a = 17.27, b = 237.7, g = a * T / (b + T) + Math.log(RH / 100);
    return b * g / (a - g);
}

function computeSVI(T, Rbend, wind, hum, temp, Tbreak, Rmin, threats, fric = 0, phosphor = 0) {
    let fT = Math.min(1, T / Tbreak) ** 2;
    let fB = Rbend < Rmin ? 1 : 0;
    let fW = Math.min(1, wind / 25);
    let fH = hum / 100;
    let fI = threats.impact ? 1 : 0;
    let fC = threats.chem ? 1 : 0;
    let fP = phosphor;
    if (threats.cut) { fT = 1; fB = 1; }
    if (threats.bend) fB = 1;
    return Math.min(1, 0.35*fT + 0.30*fB + 0.15*fI + 0.10*fric + 0.05*fW + 0.05*fH + 0.05*fC + 0.10*fP);
}

function computePhosphorIndex(epsilon, conc = 0.8, k = 4.0, epsMin = 0.001, crit = 0.6) {
    const phi = k * conc * Math.max(0, epsilon - epsMin);
    return Math.min(1, phi / crit);
}

// ===================== THREE.JS =====================
const container3d = document.getElementById('view3d');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('c3').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
const camera = new THREE.PerspectiveCamera(50, 1, 1, 600);
camera.position.set(80, 50, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(25, 40, 0);
controls.update();
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container3d.appendChild(labelRenderer.domElement);
scene.add(new THREE.AmbientLight(0x334466, 2.5));
const dir = new THREE.DirectionalLight(0xffffff, 4);
dir.position.set(100, 120, 60);
scene.add(dir);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1a2a3a }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(160, 40, 0x334466, 0x1a2a3a);
grid.position.y = 0.01;
scene.add(grid);

let droneMesh, anchorMesh, wireTube, critSphere, labels = [];

function rebuild() {
    const m_kgm = S.mass / 1000, Dh = S.dist, delta_h = S.height, Th = 50 + S.wind * 8;
    const anchor = new THREE.Vector3(25, 1.5, -25);
    const drone = new THREE.Vector3(25 + Math.cos(0.3) * Dh, S.height, -25 + Math.sin(0.3) * Dh);
    const { xs, ys, zs, tens, rads } = catenaryShape(Th, m_kgm, S.length, Dh, delta_h, S.wind, 150);
    const pts = xs.map((x, i) => new THREE.Vector3(x, ys[i], zs[i]));
    const area = Math.PI * (S.diam / 1000 / 2) ** 2;
    const strains = tens.map(t => t / (S.E * area));
    const phosphorIdx = strains.map(e => computePhosphorIndex(e, S.phosphor_conc));
    const frics = zs.map(z => Math.max(0, 1 - (z + 1.8) / 8));
    const risks = tens.map((t, i) => computeSVI(t, rads[i], S.wind, S.humidity, S.temp, S.T_break, S.R_min, S.threats, frics[i], phosphorIdx[i]));

    if (droneMesh) { scene.remove(droneMesh); scene.remove(anchorMesh); }
    droneMesh = new THREE.Group();
    droneMesh.add(new THREE.Mesh(new THREE.SphereGeometry(1.2, 16), new THREE.MeshStandardMaterial({ color: 0x00c8ff })));
    for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
        arm.position.set(Math.cos(a) * 1.6, 0, Math.sin(a) * 1.6);
        droneMesh.add(arm);
    }
    droneMesh.position.copy(drone); scene.add(droneMesh);
    anchorMesh = new THREE.Group();
    anchorMesh.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 2, 12), new THREE.MeshStandardMaterial({ color: 0xff8800 })));
    anchorMesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 12), new THREE.MeshStandardMaterial({ color: 0xffc300 })));
    anchorMesh.position.copy(anchor); scene.add(anchorMesh);

    const curve = new THREE.CatmullRomCurve3(pts);
    const tubeGeo = new THREE.TubeGeometry(curve, 200, 0.25, 8, false);
    const colors = [];
    for (let i = 0; i < tubeGeo.attributes.position.count; i++) {
        const pt = new THREE.Vector3().fromBufferAttribute(tubeGeo.attributes.position, i);
        const t = curve.getUtoTmapping(pt);
        const idx = Math.min(Math.floor(t * (pts.length - 1)), pts.length - 1);
        const r = risks[idx], p = phosphorIdx[idx];
        const col = p > 0.5 ? new THREE.Color(0xaa44ff) : r > 0.5 ? new THREE.Color(0xff3a3a) : r > 0.2 ? new THREE.Color(0xffc300) : new THREE.Color(0x00ffa3);
        colors.push(col.r, col.g, col.b);
    }
    tubeGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
    if (wireTube) scene.remove(wireTube);
    wireTube = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5 }));
    wireTube.castShadow = wireTube.receiveShadow = true; scene.add(wireTube);

    labels.forEach(l => scene.remove(l)); labels = [];
    const addLabel = (txt, pos, col) => {
        const d = document.createElement('div'); d.textContent = txt; d.style.color = col; d.style.fontWeight = 'bold';
        const lbl = new CSS2DObject(d); lbl.position.copy(pos); scene.add(lbl); labels.push(lbl);
    };
    addLabel('✈️ רחפן', drone, '#00c8ff'); addLabel('⚓ עוגן', anchor, '#ff8800');
    let maxRisk = 0, ci = 0;
    risks.forEach((r, i) => { if (r > maxRisk) { maxRisk = r; ci = i; } });
    if (critSphere) scene.remove(critSphere);
    critSphere = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16), new THREE.MeshStandardMaterial({ color: 0xff3a3a, emissive: 0x330000 }));
    critSphere.position.copy(pts[ci]); scene.add(critSphere);
    addLabel('⚠️', pts[ci], '#ff3a3a');
    updateUI(risks, tens, rads, phosphorIdx);
}

function updateUI(risks, tens, rads, phosphor) {
    const vit = 1 - risks.reduce((a, b) => a + b, 0) / risks.length;
    const maxR = Math.max(...risks);
    const maxT = Math.max(...tens);
    const minRad = Math.min(...rads.filter(r => r < 100));
    const Tdew = dewPoint(S.temp, S.humidity);
    const sag = (S.mass / 1000 * G * S.dist * S.dist) / (8 * (50 + S.wind * 8));
    const ms = 1 - maxR;
    const msEl = document.getElementById('top-ms');
    msEl.textContent = `MS = ${ms.toFixed(2)}`;
    if (ms > 0.7) { msEl.style.borderColor = 'var(--green)'; msEl.style.color = 'var(--green)'; }
    else if (ms > 0.4) { msEl.style.borderColor = 'var(--warn)'; msEl.style.color = 'var(--warn)'; }
    else { msEl.style.borderColor = 'var(--red)'; msEl.style.color = 'var(--red)'; }

    document.getElementById('vitals').innerHTML = `
        <div class="metric-card"><div class="metric-val" style="color:${vit>0.7?'var(--green)':vit>0.4?'var(--warn)':'var(--red)'}">${vit.toFixed(3)}</div><div class="metric-lbl">Vitality</div></div>
        <div class="metric-card"><div class="metric-val">${maxR.toFixed(3)}</div><div class="metric-lbl">SVI max</div></div>
        <div class="metric-card"><div class="metric-val">${maxT.toFixed(0)}</div><div class="metric-lbl">T max (N)</div></div>
        <div class="metric-card"><div class="metric-val">${minRad<99?(minRad*1000).toFixed(1):'∞'}</div><div class="metric-lbl">R min (mm)</div></div>
        <div class="metric-card"><div class="metric-val">${Math.max(...phosphor).toFixed(2)}</div><div class="metric-lbl">Phosphor</div></div>
        <div class="metric-card"><div class="metric-val">${Tdew.toFixed(1)}</div><div class="metric-lbl">T<sub>dew</sub> (°C)</div></div>
    `;
    document.getElementById('fLive').innerHTML = `T_h=${(50+S.wind*8).toFixed(0)} N | Sag=${sag.toFixed(2)} m | f_n=${(1/(2*S.length)*Math.sqrt((50+S.wind*8)/(S.mass/1000))).toFixed(2)} Hz | f_s=${(ST*S.wind/(S.diam/1000)).toFixed(2)} Hz | MS=${ms.toFixed(3)}`;
    const ab = document.getElementById('alertBox');
    if (maxR > 0.5) { ab.className = 'alert ar'; ab.textContent = '🔴 סכנה – הפחת עומס / בדוק חיבור'; }
    else if (maxR > 0.2) { ab.className = 'alert ay'; ab.textContent = '🟡 אזהרה – ניטור מוגבר'; }
    else { ab.className = 'alert ag'; ab.textContent = '🟢 כבל בריא'; }
}

// ===================== 2D =====================
function draw2D() {
    const canvas = document.getElementById('c2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const Th = 50 + S.wind * 8;
    const { xs, zs, tens, rads } = catenaryShape(Th, S.mass / 1000, S.length, S.dist, S.height, S.wind, 80);
    const frics = zs.map(z => Math.max(0, 1 - (z + 1.8) / 8));
    const risks = tens.map((t, i) => computeSVI(t, rads[i], S.wind, S.humidity, S.temp, S.T_break, S.R_min, S.threats, frics[i], 0));
    const W = canvas.width, H = canvas.height, pad = 50;
    const scaleX = (W - 2 * pad) / S.dist, scaleY = (H - 2 * pad) / Math.max(S.height, 1);
    ctx.strokeStyle = '#00c8ff44'; ctx.lineWidth = 1; ctx.setLineDash([6, 7]);
    ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 1; i < xs.length; i++) {
        ctx.beginPath();
        ctx.moveTo(pad + xs[i - 1] * scaleX, H - pad - zs[i - 1] * scaleY);
        ctx.lineTo(pad + xs[i] * scaleX, H - pad - zs[i] * scaleY);
        ctx.strokeStyle = risks[i] > 0.5 ? '#ff3a3a' : risks[i] > 0.2 ? '#ffc300' : '#00ffa3';
        ctx.lineWidth = 2.5; ctx.stroke();
    }
    const maxIdx = risks.indexOf(Math.max(...risks));
    ctx.beginPath(); ctx.arc(pad + xs[maxIdx] * scaleX, H - pad - zs[maxIdx] * scaleY, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3a3a'; ctx.fill();
    ctx.fillStyle = '#c5e0f5'; ctx.font = '10px Heebo';
    ctx.fillText(`T_max = ${Math.max(...tens).toFixed(0)} N`, pad, H - pad - 10);
}

// ===================== HEATMAP =====================
function drawHeatmap() {
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const Th = 50 + S.wind * 8;
    const { xs, zs, rads } = catenaryShape(Th, S.mass / 1000, S.length, S.dist, S.height, S.wind, 140);
    const frics = zs.map(z => Math.max(0, 1 - (z + 1.8) / 8));
    const sviVals = zs.map((z, i) => computeSVI(Math.sqrt(Th*Th+(S.mass/1000*G*z)**2), rads[i], S.wind, S.humidity, S.temp, S.T_break, S.R_min, S.threats, frics[i], 0));
    const pts = xs.map((x, i) => ({ x: 30 + (i / 139) * 860, y: 220 - zs[i] * 2.2 }));
    ctx.lineWidth = 22; ctx.strokeStyle = '#223344'; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (const p of pts) ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.lineWidth = 14;
    for (let i = 0; i < 139; i++) {
        ctx.strokeStyle = sviVals[i] > 0.8 ? '#ff3a3a' : sviVals[i] > 0.55 ? '#ffc300' : '#00ffa3';
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke();
    }
    ctx.fillStyle = '#ff3a3a'; ctx.font = 'bold 15px Heebo';
    ctx.fillText('🔥 הבטן', pts[70].x - 35, pts[70].y - 30);
    ctx.fillText('⚠️ רחפן', pts[7].x - 20, pts[7].y - 25);
    ctx.fillText('⚠️ עוגן', pts[132].x - 30, pts[132].y - 25);
    document.getElementById('tableBody').innerHTML = `
        <tr><td>0–5%</td><td>כיפוף+לייזר</td><td style="color:#ff3a3a">${sviVals[0].toFixed(2)}</td><td>f_bend=1</td><td>75%</td><td>לייזר/רשת</td></tr>
        <tr><td>40–60%</td><td>חיכוך+חיתוך</td><td style="color:#ff3a3a">${sviVals[70].toFixed(2)}</td><td>f_fric=1</td><td>90%</td><td>גדר תיל</td></tr>
        <tr><td>95–100%</td><td>כימי+כיפוף</td><td style="color:#ffc300">${sviVals[138].toFixed(2)}</td><td>α_OH↑</td><td>65%</td><td>אצטון/חיתוך</td></tr>
    `;
}

        if (t >= 60) { clearInterval(iv); log.innerHTML += '<span style="color:#ff3a3a;">🔥 כשל!</span>'; }
    }, 70);
};
