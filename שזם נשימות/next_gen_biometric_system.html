<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="טיימר נשימות מודרך — 4-7-8">
<title>שזם נשימות</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Hebrew',Segoe UI,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0d9488,#115e59,#134e4a);color:#fff;padding:20px;line-height:1.6}
.top-nav a{color:rgba(255,255,255,.92);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:inline-block;margin-bottom:18px}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:8px}
.sub{opacity:.85;margin-bottom:24px}
.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:24px;backdrop-filter:blur(8px);margin-bottom:16px}
.btn{display:inline-block;margin-top:12px;margin-left:8px;padding:12px 22px;border-radius:999px;background:#f5c842;color:#1a1a2e;font-weight:700;border:none;cursor:pointer;font-size:1rem;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:rgba(255,255,255,.2);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.card{background:rgba(0,0,0,.2);border-radius:12px;padding:18px;border:2px solid transparent;transition:.2s;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:#f5c842;transform:translateY(-2px)}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:none;margin:8px 0;font-family:inherit}
label{font-size:.9rem;opacity:.9;display:block;margin-top:10px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(245,200,66,.2);font-size:.8rem;margin:4px 4px 0 0}
</style>
</head>
<body>
<nav class="top-nav"><a href="https://storied-alfajores-6f10d2.netlify.app/portfolio.html">← תיק עבודות Patlas</a></nav><div class="wrap">
<h1>🫁 שזם נשימות</h1>
<p class="sub">תרגיל 4-7-8 — שאפו, החזיקו, נשפו</p>
<div class="panel" style="text-align:center">
  <p id="phase" style="font-size:2rem;font-weight:900">מוכן</p>
  <p id="timer" style="font-size:3rem;font-weight:900;color:#f5c842">—</p>
  <button class="btn" id="start">התחל</button>
</div></div>
<script>
const seq=[['שאף',4],['החזק',7],['נשוף',8]];let i=0,timer,left;
function tick(){document.getElementById('phase').textContent=seq[i][0];left=seq[i][1];document.getElementById('timer').textContent=left;
timer=setInterval(()=>{left--;document.getElementById('timer').textContent=left;if(left<=0){clearInterval(timer);i=(i+1)%seq.length;tick()}},1000)}
document.getElementById('start').onclick=()=>{clearInterval(timer);i=0;tick()};</script></body></html>
