<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberOS Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,sans-serif;min-height:100vh;background:linear-gradient(180deg,#0f172a,#020617);color:#e2e8f0;overflow:hidden}
.desktop{min-height:100vh;padding:48px 20px 80px;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 60L60 0' stroke='%231e293b' fill='none'/%3E%3C/svg%3E")}
.taskbar{position:fixed;bottom:0;left:0;right:0;height:52px;background:rgba(15,23,42,.92);border-top:1px solid #334155;display:flex;align-items:center;padding:0 16px;gap:12px;backdrop-filter:blur(12px)}
.start{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}

.app{text-decoration:none;color:#e2e8f0;text-align:center;padding:12px;border-radius:12px;transition:.2s}
.app:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.ico{font-size:2.2rem;display:block;margin-bottom:6px}
h1{text-align:center;margin-bottom:32px;font-weight:300;letter-spacing:.2em;opacity:.9}
