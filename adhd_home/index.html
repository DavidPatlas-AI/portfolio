<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="YomiWidget — ויג'ט שולחן עבודה: תאריך עברי, פרשה, זמני היום">
<title>YomiWidget</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Hebrew',Segoe UI,sans-serif;min-height:100vh;background:linear-gradient(135deg,#1e3a5f 0%,#0f2744 100%);color:#fff;padding:20px;line-height:1.6}
.top-nav a{color:rgba(255,255,255,.92);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:inline-block;margin-bottom:18px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:8px}
.sub{opacity:.85;margin-bottom:24px}
.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:24px;backdrop-filter:blur(8px)}
.btn{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:999px;background:#f5c842;color:#1a1a2e;font-weight:700;border:none;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.score{font-size:2rem;font-weight:900;color:#f5c842;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.card{background:rgba(0,0,0,.2);border-radius:12px;padding:16px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.2s}
.card:hover,.card.active{border-color:#f5c842;transform:translateY(-2px)}
canvas{display:block;margin:16px auto;border-radius:12px;background:#0a0a14;max-width:100%}
input[type=range]{width:100%;margin:8px 0}
label{font-size:.9rem;opacity:.9}
</style>
</head>
<body>
<nav class="top-nav"><a href="https://storied-alfajores-6f10d2.netlify.app/">← תיק עבודות Patlas</a></nav>
<div class="wrap">

<h1>🕍 YomiWidget</h1>
<p class="sub">ויג'ט Rainmeter לשולחן העבודה — תאריך עברי, פרשת השבוע וזמני היום (תל אביב)</p>
<div class="panel">
  <p id="heb" style="font-size:1.5rem;font-weight:700"></p>
  <p id="par" style="margin:8px 0"></p>
  <p id="zman" style="font-size:.95rem;opacity:.9"></p>
  <a class="btn" href="https://github.com/DavidPatlas-AI/YomiWidget" target="_blank" rel="noopener">GitHub — הורדה והתקנה</a>
</div>
</div>
<script>
const d=new Date(),gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
fetch('https://www.hebcal.com/converter?cfg=json&gy='+gy+'&gm='+gm+'&gd='+gd+'&g2h=1').then(r=>r.json()).then(j=>{
  document.getElementById('heb').textContent=j.hebrew||'';
});
fetch('https://www.hebcal.com/shabbat/?cfg=json&geonameid=293397').then(r=>r.json()).then(j=>{
  const p=(j.items||[]).find(i=>i.category==='parashat');if(p)document.getElementById('par').textContent='פרשה: '+p.hebrew;
});
const ds=gy+'-'+String(gm).padStart(2,'0')+'-'+String(gd).padStart(2,'0');
fetch('https://www.hebcal.com/zmanim?cfg=json&geonameid=293397&date='+ds).then(r=>r.json()).then(j=>{
  const t=j.times||{};document.getElementById('zman').innerHTML='עלות: '+(t.alotHaShachar||'').slice(11,16)+' · שקיעה: '+(t.sunset||'').slice(11,16)+' · צאת: '+(t.tzeit72min||'').slice(11,16);
}).catch(()=>{});
</script></body></html>
