<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="קורא ספר עם אודיו וריבוי שפות">
<title>ספר דיגיטלי — Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c842;--accent:#7c6af5;--glass:rgba(255,255,255,.1);--border:rgba(255,255,255,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Rubik,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0369a1,#0c4a6e);color:#fff;line-height:1.55}
.bg-mesh{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 80% 10%,rgba(255,255,255,.12),transparent),radial-gradient(ellipse 50% 30% at 10% 90%,rgba(0,0,0,.2),transparent)}
.nav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;background:rgba(8,8,16,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav a,.nav button{color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--border);cursor:pointer;font-family:inherit}
.nav a:hover,.nav button:hover,.tab.on{border-color:var(--gold);color:var(--gold)}
.badge{background:linear-gradient(135deg,var(--gold),#e0a820);color:#111;padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:800}
.wrap{max-width:1060px;margin:0 auto;padding:24px 18px 60px;position:relative;z-index:1}
.hero h1{font-family:Syne,sans-serif;font-size:clamp(1.7rem,4vw,2.5rem);margin:8px 0}
.hero .sub{opacity:.88;max-width:720px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}
.tab{padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--glass);cursor:pointer;font-weight:600;font-size:.88rem}
.panel{display:none;background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:22px;backdrop-filter:blur(10px);margin-bottom:16px}
.panel.on{display:block}
.panel h2{font-size:1.15rem;margin-bottom:12px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:rgba(0,0,0,.22);border-radius:14px;padding:16px;border:1px solid var(--border);transition:.2s}
.card:hover{border-color:var(--gold)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,200,66,.35)}
input,textarea,select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:#fff;font-family:inherit;margin:8px 0}
label{font-size:.85rem;opacity:.9;display:block;margin-top:10px}
.btn{display:inline-block;margin:10px 6px 0 0;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#e0a820);color:#111;font-weight:800;border:none;cursor:pointer;font-size:.92rem}
.btn.ghost{background:var(--glass);color:#fff;border:1px solid var(--border)}
.stat-row{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.stat{flex:1;min-width:90px;text-align:center;padding:14px;background:rgba(0,0,0,.25);border-radius:14px}
.stat b{display:block;font-size:1.4rem;color:var(--gold)}
.meter{height:10px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .4s}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(245,200,66,.2);font-size:.75rem;margin:4px 0 0 4px}
.trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:340px;overflow:auto;padding:4px}
.trend-chip{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,.28);cursor:pointer;font-size:.82rem;text-align:center}
.trend-chip.on{border-color:var(--gold);background:rgba(245,200,66,.15)}
.gallery img{width:100%;border-radius:12px;aspect-ratio:4/3;object-fit:cover}
pre{background:rgba(0,0,0,.4);padding:14px;border-radius:12px;overflow:auto;white-space:pre-wrap;font-size:.88rem}
.warn{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);padding:12px;border-radius:12px;margin:10px 0;display:none}
.plant-btn{cursor:pointer;text-align:center;padding:18px}
.plant-btn:hover{border-color:var(--gold);transform:translateY(-2px)}

</style>
</head>
<body>
<div class="bg-mesh"></div>
<nav class="nav">
  <a href="https://storied-alfajores-6f10d2.netlify.app/portfolio.html">← תיק עבודות</a>
  <span class="badge">תוכן מאוחד — ללא iframe</span>
</nav>
<div class="wrap">
<div class="hero"><h1>📖 ספר דיגיטלי Ultimate</h1><p class="sub">קריאה · האזנה · 3 שפות · סימניות</p></div>
<div class="tabs"><button class="tab" data-p="p1">📄 קריאה</button><button class="tab" data-p="p2">🔊 אודיו</button></div>
<div class="panel on" id="p1"><h2 id="pageTitle">פרק א — התחלה</h2><p id="pageText" style="line-height:1.8;margin:14px 0"></p>
<button class="btn ghost" id="prev">← הקודם</button><button class="btn ghost" id="nxt">הבא →</button></div>
<div class="panel" id="p2"><h2>האזנה</h2><p>מצב קריינות לפרק הנוכחי (הדגמה)</p>
<button class="btn" id="play">▶️ נגן</button><p id="audStat"></p></div>
</div>
<script>
function tabs(ids) {
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById(t.dataset.p).classList.add('on');
  });
  if(ids.length){document.querySelector('.tab').classList.add('on');document.getElementById(ids[0]).classList.add('on');}
}
const PAGES={he:['בראשית ברא אלוקים את השמים ואת הארץ.','והארץ הייתה תהו ובהו וחשך על פני תהום.'],en:['In the beginning God created the heaven and the earth.','And the earth was without form, and void.'],ru:['В начале сотворил Бог небо и землю.','Земля же была безвидна и пуста.']};
let lang='he',pi=0;function render(){pageTitle.textContent='פרק א — עמוד '+(pi+1);pageText.textContent=PAGES[lang][pi%2]}
nxt.onclick=()=>{pi++;render()};prev.onclick=()=>{if(pi)pi--;render()};
play.onclick=()=>audStat.textContent='🔊 מנגן: '+pageText.textContent.slice(0,40)+'...';render();tabs(['p1']);
</script>
</body>
</html>
